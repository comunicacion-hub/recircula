<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReCircula</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --b1: #33A8DE;
  --b2: #506CFF;
  --g1: #18AE97;
  --g2: #0BC3FF;
  --c1: #FF751F;
  --c2: #FF376F;
  --d1: #F5AD21;
  --d2: #9FDA60;
  --tx: #333333;
  --tm: #6B6B80;
  --tl: #A0A0B0;
  --bg: linear-gradient(135deg, #e8f4fd, #eef0ff, #e8faf7);
  --surface: #ffffff;
  --border: rgba(0,0,0,0.09);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  color: var(--tx);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

.grad-text {
  background: linear-gradient(90deg, var(--b1), var(--b2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Offline Banner ──────────────────────────────────────── */
#offline-banner {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #c91a44;
  color: #fff;
  text-align: center;
  padding: 8px 16px;
  font-size: 12.5px;
  font-weight: 600;
  z-index: 10000;
  transform: translateY(-100%);
  transition: transform 0.3s;
}
#offline-banner.show { transform: translateY(0); }

/* ── Spinner ─────────────────────────────────────────────── */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #e4f4fb;
  border-top-color: var(--b1);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ───────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--tx);
  color: #fff;
  padding: 11px 22px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  transition: transform 0.3s;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── LOGIN ───────────────────────────────────────────────── */
#screen-login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.login-card {
  background: #fff;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  padding: 52px 48px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.08);
}


.login-logo {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 4px;
}

.login-btn-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 28px;
}
.login-icon-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md, 14px);
  background: #fff;
  cursor: pointer;
  transition: all 0.15s;
}
.login-icon-btn:hover { background: #f8fbfd; border-color: var(--b1); transform: translateY(-1px); }
.login-icon-btn:active { transform: translateY(0); }
.login-icon-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-icon-btn svg { width: 26px; height: 26px; display: block; }

/* Modal de acceso con correo */
.modal-correo-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(10, 25, 47, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(2px);
}
.modal-correo-card {
  position: relative;
  background: #fff; border-radius: 20px;
  padding: 32px 28px; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  text-align: center;
}
.modal-correo-close {
  position: absolute; top: 14px; right: 16px;
  border: none; background: none; font-size: 26px; line-height: 1;
  color: #9aa7b5; cursor: pointer;
}
.modal-correo-close:hover { color: #5b6b7f; }
.modal-correo-title { font-size: 20px; font-weight: 800; color: var(--tx, #1b1b1b); margin-bottom: 8px; }
.modal-correo-sub { font-size: 13.5px; color: var(--tl, #6b7785); line-height: 1.55; margin-bottom: 20px; }
.modal-correo-input {
  width: 100%; padding: 13px 15px; font-size: 15px;
  border: 1px solid var(--border, #d9e2ec); border-radius: var(--radius-md, 14px);
  outline: none; transition: border-color 0.15s; margin-bottom: 14px;
  box-sizing: border-box;
}
.modal-correo-input:focus { border-color: var(--b1, #0778bf); }
.modal-correo-btn {
  width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
  color: #fff; background: var(--b1, #0778bf); border: none;
  border-radius: var(--radius-md, 14px); cursor: pointer; transition: opacity 0.15s;
}
.modal-correo-btn:hover { opacity: 0.9; }
.modal-correo-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-correo-check {
  width: 56px; height: 56px; margin: 0 auto 12px;
  border-radius: 50%; background: #e4fbf4; color: #0f6e56;
  font-size: 30px; display: flex; align-items: center; justify-content: center;
}

.login-brand {
  font-size: 13px;
  color: var(--tl);
  margin-bottom: 36px;
  font-weight: 400;
}

.login-google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 13px 20px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--tx);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.login-google-btn:hover { background: #f8fbfd; border-color: var(--b1); }
.login-google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-google-icon { width: 20px; height: 20px; }
.login-domain-note { margin-top: 16px; font-size: 11.5px; color: var(--tl); }

/* ── LOADING ─────────────────────────────────────────────── */
#screen-loading {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.load-text { font-size: 14px; color: var(--tm); font-weight: 500; }

</style>
</head>
<body>

<!-- Offline Banner -->
<div id="offline-banner">
  <i class="ti ti-wifi-off"></i> Sin conexion — Mostrando datos en cache
</div>

<!-- LOGIN -->
<div id="screen-login" class="hidden">
  <div class="login-card">
    <div class="login-logo grad-text">ReCircula+</div>
    <div class="login-btn-row">
      <button class="login-icon-btn" id="btn-login" onclick="iniciarLogin()" title="Continuar con Google" aria-label="Continuar con Google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </button>
      <button class="login-icon-btn" id="btn-login-mail" onclick="abrirModalCorreo()" title="Acceso con correo (Tesalia)" aria-label="Acceso con correo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>

      </button>
    </div>
    <div class="login-brand" style="margin-bottom:0;margin-top:24px">Una app de Redes Con Rostro</div>
  </div>
</div>

<!-- MODAL: acceso con correo y contraseña (invitado Tesalia) -->
<div id="modal-correo" class="modal-correo-overlay hidden" onclick="if(event.target===this)cerrarModalCorreo()">
  <div class="modal-correo-card">
    <button class="modal-correo-close" onclick="cerrarModalCorreo()" aria-label="Cerrar">&times;</button>
    <div class="modal-correo-title">Acceso invitado</div>
    <div class="modal-correo-sub">Ingresa con el correo y la contraseña que te compartieron.</div>
    <input type="email" id="input-correo" class="modal-correo-input" placeholder="Correo" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('input-clave').focus()">
    <input type="password" id="input-clave" class="modal-correo-input" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')ingresarInvitado()">
    <button class="modal-correo-btn" id="btn-ingresar-invitado" onclick="ingresarInvitado()">Ingresar</button>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <div class="spinner"></div>
  <div class="load-text">Cargando ReCircula+...</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script type="module">
// ============================================================
// RECIRCULA — inicio de sesión
// Ya no hay Hub: al entrar, valida al usuario y lo lleva directo a
// ambiental (o al primer dashboard que tenga asignado). Entre
// dashboards se navega con la flechita "recircula / ... ⌄" y la
// administración vive en recircula / configuraciones.
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut,
  signInWithEmailAndPassword,
  onAuthStateChanged, setPersistence, browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

// ── Configuración Firebase ─────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyApr5rH2FzuINhO26VgeYJWJAr1jznP6WI",
  authDomain: "recircula360.firebaseapp.com",
  projectId: "recircula360",
  storageBucket: "recircula360.firebasestorage.app",
  messagingSenderId: "871869415100",
  appId: "1:871869415100:web:6fe89ec7d5f632eb7a5ab9"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Firestore con caché offline (IndexedDB) — lecturas funcionan sin conexión
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  console.warn('Persistencia offline no disponible:', e);
  db = initializeFirestore(app, {});
}

const DOMAIN = 'redesconrostro.org';
const DOMINIO_VISUALIZADOR = 'cbc.co'; // Tesalia (CBC): entra automatico como Visualizador
const DOMINIO_PERSONAL = 'carlosandres.es'; // Dominio personal de Carlos: acceso Visualizador permanente
const MODULO_INICIAL = 'ambiental';    // dashboard al que se entra después de iniciar sesión

// Scopes que usan los dashboards para Google Drive (carpetas de evidencia)
const GOOGLE_SCOPES = [
  'https://www.googleapis.com/auth/drive',
  'https://www.googleapis.com/auth/spreadsheets.readonly'
];

let session     = null;
let modulos     = [];
let googleToken = null;   // token OAuth de Google (lo usan los dashboards para Drive)
let tokenExpiry = 0;
let loginEnCurso = null;  // promesa del popup de Google mientras está abierto

// ── Utilidades ─────────────────────────────────────────────
function isActivo(val) { return val === true || val === 'TRUE' || val === 'true'; }
function isValidUrl(str) {
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch { return false; }
}
function slugModulo(url) {
  try {
    const path = new URL(url, location.href).pathname.replace(/\/index\.html?$/i, '').replace(/\/+$/, '');
    return (path.split('/').pop() || '').toLowerCase();
  } catch { return ''; }
}

function updateOnlineStatus() {
  const banner = document.getElementById('offline-banner');
  if (!navigator.onLine) banner.classList.add('show');
  else banner.classList.remove('show');
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ── Caché local (la leen los dashboards para el menú de la flechita) ──
function cacheModulos() {
  try {
    localStorage.setItem('rcr_hub_data', JSON.stringify({ modulos: modulos }));
    localStorage.setItem('rcr_hub_cache_time', String(Date.now()));
  } catch(e) { console.warn('Cache write failed', e); }
}
function getCachedModulos() {
  try {
    const raw = JSON.parse(localStorage.getItem('rcr_hub_data') || 'null');
    if (raw && Array.isArray(raw.modulos)) return raw.modulos;
  } catch(e) { console.warn('Cache read failed', e); }
  return null;
}

// ── LOGIN con Google ───────────────────────────────────────
async function iniciarLogin() {
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  try {
    await setPersistence(auth, browserSessionPersistence);

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ hd: DOMAIN }); // sugerencia de dominio
    GOOGLE_SCOPES.forEach(s => provider.addScope(s));

    loginEnCurso = signInWithPopup(auth, provider);
    const result = await loginEnCurso;

    // Token OAuth de Google para Drive en los dashboards
    const credential = GoogleAuthProvider.credentialFromResult(result);
    if (credential && credential.accessToken) {
      googleToken = credential.accessToken;
      tokenExpiry = Date.now() + 55 * 60 * 1000; // ~55 min
    }
    // El resto del flujo lo maneja onAuthStateChanged
  } catch(e) {
    console.error('iniciarLogin:', e);
    if (e && e.code === 'auth/popup-closed-by-user') {
      showToast('Inicio de sesion cancelado');
    } else {
      showToast('Error al iniciar sesion');
    }
    btn.disabled = false;
  } finally {
    loginEnCurso = null;
  }
}

// ── ACCESO CON CORREO Y CONTRASEÑA — invitados (Tesalia/CBC) ──
function abrirModalCorreo() {
  const inpCorreo = document.getElementById('input-correo');
  const inpClave = document.getElementById('input-clave');
  if (inpCorreo) inpCorreo.value = '';
  if (inpClave) inpClave.value = '';
  document.getElementById('modal-correo').classList.remove('hidden');
  setTimeout(function(){ if (inpCorreo) inpCorreo.focus(); }, 50);
}
function cerrarModalCorreo() {
  document.getElementById('modal-correo').classList.add('hidden');
}

async function ingresarInvitado() {
  const email = (document.getElementById('input-correo').value || '').trim().toLowerCase();
  const clave = document.getElementById('input-clave').value || '';
  if (!email || email.indexOf('@') === -1) { showToast('Escribe un correo válido'); return; }
  if (!clave) { showToast('Escribe la contraseña'); return; }

  const btn = document.getElementById('btn-ingresar-invitado');
  if (btn) { btn.disabled = true; btn.textContent = 'Ingresando...'; }
  try {
    await setPersistence(auth, browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, clave);
    cerrarModalCorreo();
  } catch(e) {
    console.error('ingresarInvitado:', e);
    if (e && (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found')) {
      showToast('Correo o contraseña incorrectos');
    } else if (e && e.code === 'auth/too-many-requests') {
      showToast('Demasiados intentos. Espera un momento.');
    } else {
      showToast('No se pudo ingresar. Intenta de nuevo.');
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Ingresar'; }
  }
}

// ── Validar al usuario y armar su sesión ───────────────────
async function cargarDatosYEntrar(user) {
  try {
    const usrSnap = await getDocs(query(collection(db, 'Usuarios'), where('email', '==', user.email)));
    const modSnap = await getDocs(collection(db, 'Modulos'));
    modulos = modSnap.docs.map(d => ({ _docId: d.id, ...d.data() }));

    const emailLower = (user.email || '').toLowerCase();
    const esExterno = emailLower.endsWith('@' + DOMINIO_VISUALIZADOR) || emailLower.endsWith('@' + DOMINIO_PERSONAL);

    if (usrSnap.empty) {
      // Tesalia (CBC) / personal: acceso automatico como Visualizador a todos los módulos activos
      if (!esExterno) {
        showToast('Usuario no autorizado. Contacta al administrador.');
        await signOut(auth);
        mostrarLogin();
        return;
      }
      session = {
        _docId:  null,
        nombre:  user.displayName || 'Tesalia',
        email:   emailLower,
        rol:     'Visualizador',
        modulos: modulos.filter(m => isActivo(m.activo)).map(m => m.id_modulo),
        externo: true
      };
    } else {
      const meDoc = usrSnap.docs[0];
      const me = { _docId: meDoc.id, ...meDoc.data() };
      if (me.activo === false) {
        showToast('Tu cuenta esta inactiva. Contacta al administrador.');
        await signOut(auth);
        mostrarLogin();
        return;
      }
      session = {
        _docId:  me._docId,
        nombre:  me.nombre || user.displayName || 'Usuario',
        email:   me.email,
        rol:     me.rol || 'Visualizador',
        modulos: Array.isArray(me.modulos) ? me.modulos : []
      };
    }

    cacheModulos();
    await entrarAlDashboard();
  } catch(e) {
    console.error('cargarDatosYEntrar:', e);
    // Sin conexión: si ya había una sesión en esta pestaña, entrar con lo guardado
    const cached = getCachedModulos();
    const saved = sessionStorage.getItem('rcr_session');
    if (cached && saved) {
      try {
        session = JSON.parse(saved);
        modulos = cached;
        showToast('Modo sin conexion — datos en cache');
        await entrarAlDashboard();
        return;
      } catch (err) {}
    }
    showToast('Error al cargar datos');
    mostrarLogin();
  }
}

// ── Entrar: ambiental, o el primer dashboard que tenga asignado ──
async function entrarAlDashboard() {
  const visibles = modulos
    .filter(m => isActivo(m.activo) && m.url && isValidUrl(String(m.url).trim()))
    .filter(m => session.rol === 'Admin' || session.externo || (session.modulos || []).includes(m.id_modulo))
    .sort((a, b) => String(a.id_modulo || '').localeCompare(String(b.id_modulo || '')));

  if (!visibles.length) {
    showToast(session.rol === 'Admin'
      ? 'No hay dashboards activos. Entrando a configuraciones…'
      : 'No tienes dashboards asignados. Contacta al administrador.');
    if (session.rol === 'Admin') {
      sessionStorage.setItem('rcr_session', JSON.stringify(session));
      window.location.replace(location.origin + '/configuraciones/');
      return;
    }
    await signOut(auth);
    mostrarLogin();
    return;
  }

  // Si el popup de Google sigue resolviéndose, esperar el token de Drive
  if (loginEnCurso) { try { await loginEnCurso; } catch (e) {} }

  sessionStorage.setItem('rcr_session', JSON.stringify(session));
  if (googleToken) {
    sessionStorage.setItem('rcr_token',     googleToken);
    sessionStorage.setItem('rcr_token_exp', String(tokenExpiry));
  }
  const destino = visibles.find(m => slugModulo(String(m.url).trim()) === MODULO_INICIAL) || visibles[0];
  window.location.replace(String(destino.url).trim());
}

// ── Pantallas / UI ─────────────────────────────────────────
function mostrarLogin() {
  document.getElementById('screen-login').classList.remove('hidden');
  document.getElementById('screen-loading').classList.add('hidden');
  var btn = document.getElementById('btn-login');
  if (btn) btn.disabled = false;
  var btnMail = document.getElementById('btn-login-mail');
  if (btnMail) btnMail.disabled = false;
}
function mostrarLoading() {
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-loading').classList.remove('hidden');
}

function showToast(msg, dur) {
  dur = dur || 3500;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, dur);
}

// ── Exponer al ámbito global (para onclick inline) ─────────
window.iniciarLogin = iniciarLogin;
window.abrirModalCorreo = abrirModalCorreo;
window.cerrarModalCorreo = cerrarModalCorreo;
window.ingresarInvitado = ingresarInvitado;

// ── Punto de entrada: estado de autenticación ──────────────
onAuthStateChanged(auth, async function(user) {
  if (!user) {
    mostrarLogin();
    return;
  }

  var emailLower = (user.email || '').toLowerCase();
  var emailOk = emailLower.endsWith('@' + DOMAIN) ||
    emailLower.endsWith('@' + DOMINIO_VISUALIZADOR) ||
    emailLower.endsWith('@' + DOMINIO_PERSONAL);
  if (!emailOk) {
    showToast('Cuenta no permitida');
    await signOut(auth);
    mostrarLogin();
    return;
  }

  mostrarLoading();
  await cargarDatosYEntrar(user);
});
</script>
</body>
</html>
